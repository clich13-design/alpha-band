<!doctype html>
<html lang="fr" class="dark">
<head>
  <meta charset="utf-8">
  <title>ALPHA-Band — Séquenceur</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ALPHA-Band — DAW web. Séquenceur pas-à-pas 16 steps, motifs A/B/C/D, swing et humanize.">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230c1428'/%3E%3Cpath d='M14 44h6V28h-6zm10 0h6V16h-6zm10 0h6V22h-6zm10 0h6V12h-6z' fill='%2360a5fa'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap">

  <!-- Design System : tokens → base → modules -->
  <link rel="stylesheet" href="app/css/tokens.css">
  <link rel="stylesheet" href="app/css/base.css">
  <link rel="stylesheet" href="app/css/transport.css">
  <link rel="stylesheet" href="app/css/sidebar.css">
  <link rel="stylesheet" href="app/css/sequencer.css">
  <link rel="stylesheet" href="app/css/mixer.css">
</head>
<body>
  <a href="#canvas" class="skip-link">Aller au contenu principal</a>
  <div class="grain" aria-hidden="true"></div>

  <div class="app" id="app">
    <!-- Barre de transport (module transport.js) -->
    <header id="transport" role="banner"></header>

    <div class="shell">
      <!-- Bibliothèque (module sidebar.js) -->
      <aside id="sidebar" aria-label="Bibliothèque d'instruments"></aside>

      <!-- Séquenceur (module sequencer.js) + mixer compact (module mixer.js) -->
      <div class="shell__canvas" id="canvas" role="main"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module">
    import { startApp } from './app/js/app.js';
    startApp({ view: 'sequencer' });
  </script>
</body>
</html>
